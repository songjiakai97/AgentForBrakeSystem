<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制动测试分析 Agent · Demo</title>
<script src="./vendor/vue.global.prod.js"></script>
<script src="./vendor/echarts.min.js"></script>
<script src="./vendor/marked.min.js"></script>
<script src="./vendor/purify.min.js"></script>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#26344a;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--ok:#22c55e;--abn:#ef4444;--miss:#64748b;--info:#3b82f6;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
.sidebar{width:230px;border-right:1px solid #334155;display:flex;flex-direction:column;background:#0b1220}
.sidebar h1{font-size:14px;padding:14px 16px;margin:0;color:var(--accent);border-bottom:1px solid #1e293b}
.chatlist{flex:1;overflow:auto;padding:8px}
.chatitem{padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--muted)}
.chatitem:hover{background:var(--panel)}
.chatitem.active{background:var(--panel);color:var(--text)}
.chatitem .del{opacity:0;font-size:12px;color:var(--abn);padding:2px 6px}
.chatitem:hover .del{opacity:1}
.newchat{margin:10px;padding:9px;border-radius:8px;border:1px dashed #334155;background:transparent;color:var(--accent);cursor:pointer;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:10px 16px;border-bottom:1px solid #1e293b;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.badge{padding:2px 8px;border-radius:10px;font-size:11px}
.badge.offline{background:#33415a;color:#cbd5e1}
.badge.llm{background:#064e3b;color:#6ee7b7}
.msgs{flex:1;overflow:auto;padding:18px 8%}
.msg{margin-bottom:14px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg .bubble{max-width:86%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:#0369a1;color:#f0f9ff}
.msg.assistant .bubble{background:var(--panel)}
.msg.error .bubble{background:#3f1d1d;color:#fecaca;border:1px solid #7f1d1d}
/* markdown 渲染（仅 Agent 文本）：bubble 的 pre-wrap 会放大 md 内的换行，这里交回 CSS */
.bubble.md,.md{white-space:normal}
.md > :first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md p{margin:0 0 8px}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md h1,.md h2,.md h3,.md h4{margin:10px 0 6px;font-size:14px;line-height:1.4}
.md code{background:#0b1220;border:1px solid #334155;border-radius:4px;padding:1px 5px;font-size:12.5px}
.md pre{background:#0b1220;border:1px solid #334155;border-radius:8px;padding:9px 11px;overflow:auto;margin:0 0 8px}
.md pre code{background:none;border:none;padding:0}
.md table{border-collapse:collapse;margin:0 0 8px;font-size:13px}
.md th,.md td{border:1px solid #334155;padding:4px 8px;text-align:left}
.md blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid #334155;color:var(--muted)}
.md a{color:var(--accent)}
.role{font-size:11px;color:var(--muted);margin-bottom:3px}
/* panels */
.panel{background:var(--panel);border:1px solid #334155;border-radius:12px;padding:10px;max-width:86%}
.optrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.panel.used{background:var(--panel);border-style:dashed;opacity:.85}
.optrow:hover{background:var(--panel2)}
.optrow:active{background:#2f4363}
.optrow .idx{width:20px;height:20px;border-radius:6px;background:#334155;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.optrow .score{margin-left:auto;color:var(--muted);font-size:11px}
.panel .hint{font-size:12px;color:var(--muted);padding:4px 10px}
.profileSel{display:flex;gap:8px;padding:8px 10px;align-items:center;flex-wrap:wrap}
.profileSel select{background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:6px;padding:5px 8px;font-size:13px}
.pfBtn{background:var(--accent);color:#0b1220;border:none;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
.otherOpt{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #1e293b;margin-top:6px}
.otherOpt input{flex:1;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:6px;padding:6px 9px;font-size:12px}
.otherOpt button{background:#334155;border:none;color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
/* analysis card */
.acard{background:var(--panel);border:1px solid #334155;border-radius:12px;padding:12px;max-width:92%;font-size:13px}
.acard .head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.acard .head b{font-size:13px}
.runrow{border-top:1px solid #1e293b;padding:8px 2px}
.runrow .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:2px 9px;border-radius:10px;font-size:11px;cursor:pointer}
.chip.ok{background:#052e16;color:#86efac}.chip.abnormal{background:#450a0a;color:#fca5a5}
.chip.missing{background:#1e293b;color:#94a3b8}.chip.info{background:#172554;color:#93c5fd}
.detail{background:#0b1220;border-radius:8px;padding:10px;margin-top:8px;font-size:12px}
.mline{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #1e293b;gap:8px;flex-wrap:wrap}
.verdict{margin-top:8px}
.verdict .v{background:#1e293b;border-left:3px solid var(--abn);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:5px;font-size:12px}
.verdict .v.missing{border-color:var(--miss)}
.verdict .v .sev{font-size:10px;color:var(--muted)}
.suggest{margin-top:10px;background:#0b1220;border:1px solid #14532d;border-radius:8px;padding:10px;font-size:12px}
.suggest h4{margin:0 0 6px;font-size:12px;color:#4ade80}
.suggest .act{padding:4px 0;border-bottom:1px dashed #1e293b}
.btnMini{background:#334155;border:none;color:#cbd5e1;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer}
/* composer */
.composer{border-top:1px solid #1e293b;padding:10px 8% 14px;background:#0b1220}
.pending{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fchip{background:var(--panel);border:1px solid #334155;border-radius:14px;padding:3px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.fchip button{background:none;border:none;color:var(--abn);cursor:pointer;font-size:12px;padding:0}
.uploaded{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.inputrow{display:flex;gap:8px;align-items:flex-end}
.addbtn{width:38px;height:38px;border-radius:50%;border:1px solid #334155;background:var(--panel);color:var(--accent);font-size:20px;cursor:pointer;flex:none}
textarea{flex:1;background:var(--panel);border:1px solid #334155;border-radius:10px;color:var(--text);padding:9px 12px;font-size:14px;resize:none;height:38px;max-height:110px;font-family:inherit}
.sendbtn{background:var(--accent);border:none;color:#0b1220;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
.sendbtn:disabled{opacity:.4}
.chartbox{position:fixed;inset:4vh 6vw;background:var(--bg);border:1px solid #334155;border-radius:14px;z-index:50;display:flex;flex-direction:column}
.chartbox .cb-head{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #1e293b;font-size:13px}
.chartbox .cb-body{flex:1;min-height:0}
.chartbox select{background:var(--panel);color:var(--text);border:1px solid #334155;border-radius:6px;padding:3px 8px;font-size:12px}
.empty{color:var(--muted);font-size:13px;text-align:center;margin-top:18vh;line-height:2}
/* steps：工具调用/编排过程（可折叠） */
.steps{background:#0b1220;border:1px solid #233248;border-radius:10px;max-width:86%;font-size:12px;overflow:hidden}
.steps-head{padding:7px 12px;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center}
.steps-head:hover{color:var(--text)}
.steps-head .tag{font-size:10px;border:1px solid #334155;border-radius:8px;padding:1px 7px;color:#7dd3fc}
.steps-body{border-top:1px dashed #1e293b;padding:6px 12px 9px}
.step-row{display:flex;gap:8px;align-items:baseline;padding:3px 0;flex-wrap:wrap}
.step-row .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;position:relative;top:-1px}
.step-row.run .dot{background:var(--info)} .step-row.ok .dot{background:var(--ok)}
.step-row.warn .dot{background:#f59e0b} .step-row.error .dot{background:var(--abn)}
.step-row b{font-weight:600;color:#cbd5e1}
.step-row .det{color:var(--muted);font-size:11px}
/* 流式思考/正文 */
.think{background:#0b1220;border:1px dashed #334155;border-radius:10px;max-width:86%;padding:7px 12px;font-size:12px}
.think-head{cursor:pointer;color:#7dd3fc;display:flex;gap:6px;align-items:center}
.think-body{margin-top:6px;color:var(--muted);white-space:normal;max-height:220px;overflow:auto;font-size:12.5px}
.bubble.streaming{border:1px solid #38bdf8}
.gchk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
.gchk label{display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--muted)}
.gchk label.on{color:var(--text)}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="sidebar">
    <h1>制动测试分析 Agent</h1>
    <div class="chatlist">
      <div v-for="c in chats" :key="c.chat_id" class="chatitem" :class="{active: c.chat_id===chatId}" @click="openChat(c.chat_id)">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{c.title}}</span>
        <span class="del" @click.stop="delChat(c.chat_id)">删除</span>
      </div>
    </div>
    <button class="newchat" @click="newChat">+ 新建对话</button>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="badge" :class="meta.engine">{{meta.engine==='llm' ? ('LLM: '+(meta.model||'')) : '离线模式（规则链路）'}}</span>
      <span v-if="chat" style="margin-left:auto;font-size:11px">
        工况: {{ chat.selected_condition || '—' }} <span v-if="chat.selected_profile">· 档位 {{chat.selected_profile}}</span>
      </span>
      <a href="/debug" target="_blank" style="color:var(--muted);font-size:11px">debug</a>
    </div>

    <div class="msgs" ref="msgs">
      <div v-if="!chat" class="empty">加载中…</div>
      <template v-else>
      <div v-if="!chat.messages.length" class="empty">
        上传 .mf4 数据文件，然后描述要分析的目标，例如：<br>
        「干沥青 100kph 全力制动的制动距离怎么样」<br>「玄武岩 0-60 全油门加速打滑超限了吗」
      </div>
      <div v-for="m in chat.messages" :key="m.message_id" class="msg" :class="[m.role, m.kind==='error'?'error':'']">
        <div class="role">{{m.role==='user'?'我':'Agent'}} · {{m.kind}}</div>

        <!-- steps：工具调用/编排过程，默认折叠 -->
        <div v-if="m.kind==='steps'" class="steps">
          <div class="steps-head" @click="toggleOpen('st:'+m.message_id)">
            <span>{{openState['st:'+m.message_id] ? '▾' : '▸'}}</span>
            <span class="tag">过程</span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{(m.data&&m.data.items||[]).length}} 步</span>
          </div>
          <div class="steps-body" v-if="openState['st:'+m.message_id]">
            <div v-for="(r,ri) in (m.data&&m.data.items)||[]" :key="ri" class="step-row" :class="r.status">
              <span class="dot"></span><b>{{r.label}}</b><span class="det">{{r.detail}}</span>
            </div>
          </div>
        </div>

        <!-- text / error：Agent 文本按 Markdown 渲染，用户消息与错误保持纯文本 -->
        <div v-else-if="m.kind==='text'||m.kind==='error'" class="bubble"
             :class="{md: m.role==='assistant' && m.kind==='text', streaming: m.kind==='text' && m.meta && m.meta.streaming}">
          <span v-if="m.role==='assistant' && m.kind==='text'" v-html="md(m.content)"></span>
          <template v-else>{{m.content}}</template>
        </div>

        <!-- attachment note -->
        <div v-else-if="m.kind==='attachment'" class="bubble">📎 {{m.content}}</div>

        <!-- target options：一次性面板，点选后折叠为回执 -->
        <div v-else-if="m.kind==='target_options'" class="panel" :class="{used: consumed(m)}">
          <template v-if="consumed(m)">
            <div class="hint">
              <template v-if="m.meta && m.meta.chosen">已选择：{{m.meta.chosen}}</template>
              <template v-else>该面板已被后续消息取代</template>
              <span style="color:var(--muted)">（选项已失效）</span>
            </div>
          </template>
          <template v-else>
          <div class="hint">{{m.content}}</div>
          <template v-if="m.data.hop==='function'||m.data.hop==='condition'">
            <div v-for="(c,i) in m.data.candidates" :key="c.key" class="optrow" @click="choose(m,c)">
              <span class="idx">{{i+1}}</span><span>{{c.name}}</span>
              <span class="score" v-if="c.score">{{c.score.toFixed(1)}}</span>
            </div>
          </template>
          <template v-else-if="m.data.hop==='profile'">
            <div class="profileSel">
              <template v-for="(dim,di) in dimsOf(m)" :key="di">
                <select v-model="pfSel[m.message_id][di]">
                  <option v-for="p in dim" :key="p" :value="p">{{p}}</option>
                </select>
              </template>
              <button class="pfBtn" :disabled="busy" @click="chooseProfile(m)">
                {{busy ? '处理中…' : '确认分析'}}</button>
            </div>
          </template>
          <div class="otherOpt">
            <input v-model="otherText[m.message_id]" placeholder="其他选项：手动描述目标，回车重新推荐" @keyup.enter="otherGo(m)">
            <button @click="otherGo(m)">发送</button>
          </div>
          </template>
        </div>

        <!-- analysis result -->
        <div v-else-if="m.kind==='analysis_result'" class="acard">
          <div class="head"><b>{{m.data.condition_name}}</b>
            <span v-if="m.data.profile" class="chip missing">档位 {{m.data.profile}}</span>
            <span v-if="m.data.degraded" class="chip missing">仅规则结论</span>
            <span style="margin-left:auto;font-size:11px;color:var(--muted)">{{m.data.sample_count}} 个事件样本</span>
          </div>
          <div v-for="s in m.data.samples" :key="s.sample_id" class="runrow">
            <div class="meta">
              <span>📄 {{s.file_name}} · run {{s.run_index}}</span>
              <span v-if="s.window && !isNaN(s.window.t_start)">窗口 [{{fmt(s.window.t_start)}}, {{fmt(s.window.t_end)}}] s（{{dur(s.window)}}s）</span>
              <span v-else style="color:var(--miss)">无有效事件窗口</span>
              <button class="btnMini" @click="showChart(s, m)">查看图表</button>
            </div>
            <div class="chips">
              <span v-for="x in s.metrics" :key="x.key" class="chip" :class="x.status" @click="toggle(s.sample_id+':'+m.message_id)">
                {{x.name}}: {{val(x)}}
              </span>
            </div>
            <div v-if="opened[s.sample_id+':'+m.message_id]" class="detail">
              <div v-for="x in s.metrics" :key="x.key" class="mline">
                <span>{{x.name}} <span class="chip" :class="x.status" style="cursor:default">{{x.status}}</span></span>
                <span>{{val(x)}} {{x.unit}} <span style="color:var(--muted)">限值 {{range(x)}}{{x.profile?(' · '+x.profile):''}}</span></span>
              </div>
              <div class="verdict" v-if="s.verdicts.length">
                <div v-for="v in s.verdicts" :key="v.rule_id" class="v" :class="{missing:v.status==='missing'}">
                  [{{v.severity}}/{{v.fault_domain}}] {{v.message}}
                  <div class="sev">{{v.metric_name}}：{{v.direction}} · 规则 {{v.rule_id}}</div>
                </div>
              </div>
              <div v-else class="verdict"><div class="v" style="border-color:var(--ok)">全部指标达标，无规则命中</div></div>
            </div>
            <div v-if="m.data.llm_suggestion" class="suggest">
              <h4>LLM 标定建议（区分于规则结论）</h4>
              <div class="md" v-html="md(m.data.llm_suggestion.summary)"></div>
              <div v-for="(a,i) in (m.data.llm_suggestion.calibration_actions||[])" :key="i" class="act">
                {{a.param}} → <b>{{a.direction}}</b>（{{a.metric}}）：{{a.expected_effect}} <span style="color:var(--muted)">风险: {{a.risk}}</span>
              </div>
            </div>
          </div>
        </div>

        <div v-else class="bubble">{{m.content}}</div>
      </div>

      <!-- 流式过程：思考（可折叠）+ 正文逐字 -->
      <div v-if="live.engine" class="msg assistant">
        <div class="role">Agent · {{live.engine}}{{live.done?'':' · 进行中'}}</div>
        <div v-if="live.reasoning" class="think">
          <div class="think-head" @click="live.showThink=!live.showThink">
            <span>{{live.showThink ? '▾' : '▸'}}</span><span>💭 思考过程（{{live.reasoning.length}} 字）</span>
          </div>
          <div class="think-body md" v-if="live.showThink" v-html="md(live.reasoning)"></div>
        </div>
        <div v-if="live.content" class="bubble md streaming" v-html="md(live.content)"></div>
      </div>
      <div v-if="busy && !live.content && !live.reasoning && live.engine" class="msg assistant"><div class="role">Agent</div><div class="bubble">处理中…</div></div>
      <div v-else-if="busy && !live.engine" class="msg assistant"><div class="role">Agent</div><div class="bubble">分析中…</div></div>
      </template>
    </div>

    <div class="composer">
      <div class="uploaded" v-if="chat && chat.files.length">
        <span v-for="f in chat.files" :key="f.file_id" class="fchip">✅ {{f.name}}
          <button @click="delFile(f.file_id)">✕</button></span>
      </div>
      <div class="pending" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px" v-if="samples.length">
        <span style="font-size:11px;color:var(--muted);align-self:center">合成样例:</span>
        <span v-for="s in samples.slice(0,8)" :key="s" class="fchip" style="color:#7dd3fc;cursor:pointer" @click="loadSample(s)" title="点击载入到本对话">⬇ {{s.replace('.mf4','')}}</span>
      </div>
      <div class="pending" v-if="pending.length">
        <span v-for="(p,i) in pending" :key="i" class="fchip">📎 {{p.name}}<button @click="pending.splice(i,1)">✕</button></span>
      </div>
      <div class="inputrow">
        <button class="addbtn" @click="$refs.file.click()" title="仅支持 .mf4">+</button>
        <input ref="file" type="file" accept=".mf4" multiple style="display:none" @change="pickFiles">
        <textarea v-model="draft" placeholder="描述要分析的功能/工况，如：干沥青 100kph 全力制动" @keydown.enter.exact.prevent="send"></textarea>
        <button class="sendbtn" :disabled="busy" @click="send">发送</button>
      </div>
    </div>
  </div>

  <div class="chartbox" v-if="chartData">
    <div class="cb-head">
      <span>{{chartTitle}} — 多行子图 · 共享时间轴（滚轮缩放 / 拖拽平移）</span>
      <span class="gchk">
        <label v-for="g in chartGroups" :key="g.index" :class="{on: !chartHidden.includes(g.index)}">
          <input type="checkbox" :checked="!chartHidden.includes(g.index)" @change="toggleGroup(g.index)">
          {{g.label}}<span style="color:var(--muted)">（{{g.signals.length}}）</span>
        </label>
      </span>
      <button class="btnMini" @click="closeChart">关闭 ✕</button>
    </div>
    <div class="cb-body" ref="chartEl"></div>
  </div>
</div>

<script>
const { createApp } = Vue;
const blankLive = () => ({engine:'', reasoning:'', content:'', showThink:true, done:false});
createApp({
  data(){ return {
    meta:{engine:'offline'}, chats:[], chat:null, chatId:'',
    draft:'', pending:[], busy:false, samples:[],
    otherText:{}, pfSel:{}, opened:{}, openState:{},
    live: blankLive(), lastSeq: 0, currentRunId: '', runCid: '',
    chartData:null, chartTitle:'', chartGroups:[], chartHidden:[], chartFull:null, _chart:null,
  }},
  async mounted(){
    try{ this.meta = await (await fetch('/api/meta')).json(); }catch(e){}
    try{ this.samples = await (await fetch('/api/samples')).json(); }catch(e){}
    await this.loadChats();
    const h = location.hash.match(/^#\/chat\/(\w+)/);
    if(h && this.chats.some(c=>c.chat_id===h[1])) this.openChat(h[1]);
    else if(this.chats.length) this.openChat(this.chats[0].chat_id);
    else await this.newChat();
  },
  methods:{
    md(t){
      if(!t) return '';
      // marked 只做解析，DOMPurify 兜底：库缺失则退回转义纯文本，
      // 绝不用 v-html 渲染未经净化的内容
      if(typeof marked==='undefined' || typeof DOMPurify==='undefined') return this.plain(t);
      try{
        return DOMPurify.sanitize(marked.parse(String(t), {breaks:true, gfm:true}));
      }catch(e){ return this.plain(t); }
    },
    plain(t){ return String(t).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>'); },
    consumed(m){ return !!(m.meta && m.meta.consumed); },
    toggleOpen(k){ this.openState[k] = !this.openState[k]; },
    fmt(t){ return t==null?'—':Number(t).toFixed(2); },
    dur(w){ if(!w||w.t_start==null||w.t_end==null) return '0'; const d=w.t_end-w.t_start;
      return isFinite(d)? d.toFixed(2):'0'; },
    val(x){ if(x.value==null) return '—'; return Number(x.value).toFixed(2); },
    range(x){ if(!x.ok_range) return '无限值'; const[lo,hi]=x.ok_range;
      if(lo!=null&&hi!=null)return `${lo}~${hi}`; if(lo!=null)return `≥${lo}`; return `≤${hi}`; },
    chunkDims(ps){ const half=Math.ceil(ps.length/2); return [ps.slice(0,half),ps.slice(half)].filter(a=>a.length); },
    nav(cid){ location.hash = '#/chat/'+cid; },
    async loadChats(){ this.chats = await (await fetch('/api/chats')).json(); },
    async newChat(){
      const c = await (await fetch('/api/chats',{method:'POST'})).json();
      await this.loadChats(); this.openChat(c.chat_id);
    },
    initPanelState(msgs){
      (msgs||[]).forEach(m=>{
        if(m.kind==='target_options'){
          if(!(m.message_id in this.otherText)) this.otherText[m.message_id]='';
          if(m.data && m.data.hop==='profile' && !(m.message_id in this.pfSel)){
            const dims=m.data.profile_dims||this.chunkDims(m.data.profiles||(m.data.target&&m.data.target.profiles)||[]);
            this.pfSel[m.message_id]=dims.map(d=>d[0]);
          }
        }});
    },
    async openChat(cid){
      this.chatId=cid; this.nav(cid);
      // 切到别的会话：上一会话的流式预览不再属于这里（那轮仍在后台跑，切回去可续看）
      if(this.runCid && this.runCid!==cid){ this.live=blankLive(); }
      this.chat = await (await fetch('/api/chats/'+cid)).json();
      this.initPanelState(this.chat.messages);
      this.$nextTick(this.scroll);
      // 刷新/重进会话时：若后台还有一轮在跑（引擎与连接已解耦），重新订阅回放整轮过程
      if(!this.busy) this.attachActiveRun();
    },
    async attachActiveRun(){
      if(this._attaching) return;
      this._attaching = true;
      try{
        const d = await (await fetch(`/api/chats/${this.chatId}/run`)).json();
        if(!d.run || d.run.status!=='running') return;
        const cid = this.chatId;
        this.busy = true;
        this.live = blankLive();
        this.lastSeq = 0;                 // 从头回放整轮：思考流与已产生的消息都能补回来
        this.currentRunId = d.run.run_id; this.runCid = cid;
        try{ await this.followRun(d.run.run_id); }finally{ this.busy = false; }
        // 回放事件都已转成落库消息，live 只用于展示进行中的部分，收尾即清
        if(this.chatId===cid) this.live = blankLive();   // 切走了就别动当前会话的显示
        this.currentRunId = ''; this.runCid = '';
        if(this.chatId===cid) await this.openChatKeepScroll();
      }catch(e){ this.busy=false; }
      finally{ this._attaching = false; }
    },
    async delChat(cid){
      if(!confirm('删除该对话及其全部文件、消息与分析缓存？')) return;
      const r = await (await fetch('/api/chats/'+cid,{method:'DELETE'})).json();
      await this.loadChats();
      if(cid===this.chatId){
        if(r.next_chat) this.openChat(r.next_chat);
        else if(this.chats.length) this.openChat(this.chats[0].chat_id);
        else await this.newChat();
      }
    },
    async delFile(fid){
      await fetch(`/api/chats/${this.chatId}/files/${fid}`,{method:'DELETE'});
      await this.openChat(this.chatId);
    },
    async loadSample(s){
      const r=await fetch('/api/samples/'+s);
      if(!r.ok){ alert('样例下载失败'); return; }
      const b=await r.blob();
      this.pending.push(new File([b],s,{type:'application/octet-stream'}));
    },
    pickFiles(ev){
      const fs=[...ev.target.files];
      for(const f of fs){
        if(!f.name.toLowerCase().endsWith('.mf4')){ alert(`demo 仅接受 .mf4 文件：${f.name} 已忽略`); continue; }
        this.pending.push(f);
      }
      ev.target.value='';
    },
    async uploadPending(){
      if(!this.pending.length) return true;
      const fd=new FormData();
      this.pending.forEach(f=>fd.append('files',f));
      const r=await fetch(`/api/chats/${this.chatId}/files`,{method:'POST',body:fd});
      if(!r.ok){ const e=await r.json(); alert(e.detail||'上传失败'); return false; }
      this.pending=[];
      await this.openChat(this.chatId);
      return true;
    },
    // ------------------------------------------------ SSE 事件流
    pushMsg(m){
      // 服务端权威消息：替换同 id（steps 会原地追加），否则追加
      const arr=this.chat.messages;
      const i=m.message_id?arr.findIndex(x=>x.message_id===m.message_id):-1;
      if(i>=0) arr.splice(i,1,m); else arr.push(m);
      if(m.kind==='target_options'){
        this.otherText[m.message_id]='';
        if(m.data&&m.data.hop==='profile'){
          const dims=m.data.profile_dims||this.chunkDims(m.data.profiles||(m.data.target&&m.data.target.profiles)||[]);
          this.pfSel[m.message_id]=dims.map(d=>d[0]);
        }
      }
    },
    onEvent(name, data){
      // 事件属于发起它的那一轮：用户中途切了会话就丢弃（服务端照常落库，切回去看得到）
      if(this.runCid && this.runCid!==this.chatId) return;
      if(name==='run'){
        this.currentRunId = data.run_id || this.currentRunId;
        if(data.status && data.status!=='running') this.live.done = true;
        return;
      }
      if(name==='run_error'){
        this.chat.messages.push({message_id:'tmp_x'+Date.now(),role:'assistant',kind:'error',
                                 content:'本轮执行失败：'+(data.error||''),meta:{}});
        this.live.done = true;
        return;
      }
      if(name==='delta'){
        const ch=data.channel;
        if(ch==='meta') this.live.engine=data.engine||'offline';
        else if(ch==='reasoning') this.live.reasoning+=data.text;
        else if(ch==='content') this.live.content+=data.text;
        else if(ch==='reset'){ this.live.reasoning=''; this.live.content=''; }
      } else if(name==='message'){
        const m=data;
        // 正文已流式给出的文本消息：落库版本接手展示，live 气泡让位
        if(m.kind==='text' && m.role==='assistant' && this.live.content && m.meta && m.meta.streamed)
          this.live.content='';
        this.pushMsg(m);
      } else if(name==='done'){
        this.live.done=true;
      }
      this.$nextTick(this.scroll);
    },
    // 读取一条 SSE 流：记录每帧 seq，供断线后增量续传；返回是否正常读完
    async consumeStream(response){
      const reader=response.body.getReader(), dec=new TextDecoder();
      let buf='', sawDone=false;
      const feed=(frame)=>{
        let ev='message', payload='', idv=null;
        for(const line of frame.split('\n')){
          if(line.startsWith('event:')) ev=line.slice(6).trim();
          else if(line.startsWith('data:')) payload+=line.slice(5).trim();
          else if(line.startsWith('id:')) idv=line.slice(3).trim();
        }
        if(!payload) return;
        let obj=null;
        try{ obj=JSON.parse(payload); }catch(e){ return; }
        // 先派发再推进 seq：派发异常时下次重连会重放这一帧，不会静默丢事件
        if(ev==='done') sawDone=true;
        this.onEvent(ev, obj);
        if(idv!==null && Number(idv)>=this.lastSeq) this.lastSeq=Number(idv)+1;
      };
      for(;;){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        let k;
        while((k=buf.indexOf('\n\n'))>=0){ feed(buf.slice(0,k)); buf=buf.slice(k+2); }
      }
      return sawDone;
    },
    async followRun(runId){
      // 订阅直到本轮真正结束；连接断了就凭 lastSeq 增量重连（服务端有缓冲，不丢字）
      for(let attempt=0; attempt<8; attempt++){
        if(this.chatId!==this.runCid) return true;        // 用户切走了：别再往这个会话写
        try{
          const r = await fetch(`/api/runs/${runId}/stream?after=${this.lastSeq-1}`);
          if(r.status===404) return true;            // 已回收：消息已落库，读历史即可
          if(!r.ok) throw new Error('HTTP '+r.status);
          if(await this.consumeStream(r)) return true;
        }catch(e){ /* 断线：下面重试 */ }
        if(this.chatId!==this.runCid) return true;
        const st = await fetch(`/api/chats/${this.chatId}/run`).then(x=>x.json()).catch(()=>({run:null}));
        if(!st.run || st.run.run_id!==runId) return true;   // 后台已跑完
        await new Promise(res=>setTimeout(res, 600));
      }
      return false;
    },
    async streamSend(text){
      this.live = blankLive();
      this.lastSeq = 0; this.currentRunId = ''; this.runCid = this.chatId;
      const r = await fetch(`/api/chats/${this.chatId}/messages/stream`,
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      if(!r.ok){
        let detail='请求失败'; try{ detail=(await r.json()).detail||detail; }catch(e){}
        return {ok:false, detail};
      }
      const finished = await this.consumeStream(r);
      // 连接中断但后台仍在跑 → 自动续订，用户不需要刷新
      if(!finished && this.currentRunId) await this.followRun(this.currentRunId);
      return {ok:true};
    },
    async send(){
      const text=this.draft.trim();
      if(!text && !this.pending.length) return;
      if(this.busy) return;
      this.busy=true;
      try{
        if(!(await this.uploadPending())) return;
        if(!text) { await this.openChat(this.chatId); return; }
        this.draft='';
        this.chat.messages.push({message_id:'tmp_u'+Date.now(),role:'user',kind:'text',content:text,meta:{}});
        this.$nextTick(this.scroll);
        const res = await this.streamSend(text);
        if(!res.ok){
          this.chat.messages.push({message_id:'tmp_e'+Date.now(),role:'assistant',kind:'error',content:res.detail,meta:{}});
        }
        await this.loadChats();
        await this.openChatKeepScroll();
      } finally {
        this.busy=false;
        this.live=blankLive(); this.runCid='';   // 本轮已结束，指针一律复位
        this.$nextTick(this.scroll);
      }
    },
    async choose(m,c){
      const rec=m.data;
      if(rec.hop==='function') return this.select('function',c.key,null,m,c.name);
      return this.select('condition',c.key,null,m,c.name);
    },
    dimsOf(m){
      const d=m.data||{};
      if(d.profile_dims&&d.profile_dims.length)
        return d.profile_dims.filter(x=>x&&x.length);
      const ps=d.profiles||(d.target&&d.target.profiles)||[];
      return ps.length?this.chunkDims(ps):[];
    },
    async select(t,key,profile,panel,label){
      // 连点保护：上一次选择未返回时忽略新点击（否则同一面板会重复触发分析）
      if(this.busy) return;
      // 乐观折叠：点下去就把面板变成回执，等服务端确认（存储层同样会写 consumed）
      if(panel){
        panel.meta = Object.assign({}, panel.meta, {consumed:true, chosen: label || (panel.meta&&panel.meta.chosen) || key});
      }
      this.busy=true;
      try{
        const r=await fetch(`/api/chats/${this.chatId}/select`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type:t,target_key:key,profile:profile})});
        const d=await r.json();
        if(!r.ok){ this.chat.messages.push({message_id:'tmp_e'+Date.now(),role:'assistant',kind:'error',content:d.detail||'操作失败',meta:{}}); }
        else {
          (d.messages||[]).forEach(x=>this.pushMsg(x));
        }
        await this.openChatKeepScroll();
      } finally{ this.busy=false; }
    },
    async chooseProfile(m){
      const sel=this.pfSel[m.message_id]||[];
      const profile=sel.filter(Boolean).join('|');
      const key=(m.data.target&&m.data.target.key) || (m.data.candidates&&m.data.candidates[0]&&m.data.candidates[0].key);
      if(!key){ alert('缺少工况 key'); return; }
      const label=((m.data.target&&m.data.target.name)||key)+`（${profile}）`;
      await this.select('condition',key,profile,m,label);
    },
    async otherGo(m){
      const t=(this.otherText[m.message_id]||'').trim();
      if(!t || this.busy) return;
      this.otherText[m.message_id]='';
      // 改用手打目标：本面板作废（服务端本轮开始同样会标记 consumed）
      m.meta = Object.assign({}, m.meta, {consumed:true});
      this.busy=true;
      try{
        this.chat.messages.push({message_id:'tmp_u'+Date.now(),role:'user',kind:'text',content:t,meta:{}});
        const res = await this.streamSend(t);
        if(!res.ok) this.chat.messages.push({message_id:'tmp_e'+Date.now(),role:'assistant',kind:'error',content:res.detail,meta:{}});
        await this.openChatKeepScroll();
      } finally{
        this.busy=false;
        this.live=blankLive(); this.runCid='';   // 本轮已结束，指针一律复位
      }
    },
    async openChatKeepScroll(){
      const el=this.$refs.msgs; const at=el?el.scrollTop:0;
      this.chat = await (await fetch('/api/chats/'+this.chatId)).json();
      this.initPanelState(this.chat.messages);
      await this.loadChats();
      this.$nextTick(()=>{ if(el) el.scrollTop=at; this.scroll(); });
    },
    scroll(){ const el=this.$refs.msgs; if(el) el.scrollTop=el.scrollHeight; },
    toggle(sid,key){ const k=sid+':'+this._curMid(sid); this.opened[k]=!this.opened[k]; },
    _curMid(){ return 'all'; },
    // ------------------------------------------------ 图表：多 grid 共享 x 轴
    async showChart(s){
      this.chartTitle=`${s.file_name} · run ${s.run_index}`;
      const r=await fetch(`/api/analyses/${s.sample_id}/timeseries`);
      if(!r.ok){ alert((await r.json()).detail||'无法获取时序'); return; }
      const data = await r.json();
      this.chartData=Vue.markRaw(data);
      const opt=data.chart_option||{};
      this.chartGroups=(opt._groups)||[];
      this.chartHidden=[];
      // ECharts 会向传入 setOption 的对象写入 __ec_inner_ 内部符号：
      // 渲染用一份、按组显隐重建用另一份干净深拷贝，避免二次注入报错
      this.chartFull=Vue.markRaw(JSON.parse(JSON.stringify(opt)));
      this.$nextTick(()=>{ this.renderSeries(); });
    },
    toggleGroup(i){
      const k=this.chartHidden.indexOf(i);
      if(k>=0) this.chartHidden.splice(k,1); else this.chartHidden.push(i);
      if(!this._chart||this._chart.isDisposed()) return;
      // 显隐走 legend.selected（merge 更新）：不重建 grid/轴，避开多 grid notMerge 崩溃
      const sel={};
      const hidden=new Set(this.chartHidden);
      (this.chartGroups||[]).forEach(g=>{
        g.signals.forEach(s=>{ sel[s]=!hidden.has(g.index); });
      });
      this._chart.setOption({legend:{selected:sel}});
    },
    closeChart(){
      this.chartData=null;
      if(this._chart && !this._chart.isDisposed()) this._chart.dispose();
      this._chart=null;
    },
    renderSeries(){
      const el=this.$refs.chartEl;
      if(!el||!this.chartData||!this.chartFull) return;
      if(this._chart && !this._chart.isDisposed()) this._chart.dispose();
      this._chart=Vue.markRaw(echarts.init(el,null,{renderer:'canvas'}));
      // 服务端已排好多 grid/共享 x：原样渲染，显隐交给 legend.selected
      const opt=JSON.parse(JSON.stringify(this.chartFull));
      const sel={};
      const hidden=new Set(this.chartHidden);
      (this.chartGroups||[]).forEach(g=>{
        g.signals.forEach(s=>{ sel[s]=!hidden.has(g.index); });
      });
      opt.legend={show:false, data:(opt.series||[]).map(s=>s.name), selected:sel, type:'scroll'};
      opt.textStyle={color:'#e2e8f0'};
      opt.backgroundColor='transparent';
      (opt.xAxis||[]).forEach(ax=>{
        ax.axisLine={lineStyle:{color:'#334155'}};
        ax.axisLabel=Object.assign({}, ax.axisLabel, {color:'#94a3b8'});
      });
      (opt.yAxis||[]).forEach(ax=>{
        ax.nameTextStyle=Object.assign({}, ax.nameTextStyle, {color:'#94a3b8'});
        ax.axisLabel=Object.assign({}, ax.axisLabel, {color:'#94a3b8'});
      });
      (opt.series||[]).forEach(s=>{ s.lineStyle=Object.assign({width:1.2}, s.lineStyle); });
      this._chart.setOption(opt, true);
      this._chart.resize();
    },
  }
}).mount('#app');
</script>
</body>
</html>
