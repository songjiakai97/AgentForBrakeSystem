# BLF 信号映射（design.md §9.6）
#
# demo 约定：一份 DBC 管全部逻辑信号（configs/dbc/brake_demo.dbc，由
# scripts/generate_demo_blf.py 用 cantools 生成并提交入库），实车信号名 = 逻辑名，
# 所有报文都发在通道 0（dbc_files.channel: 0，BLFLoader 按
# (frame_id, is_extended, channel) 匹配帧）。
#
# DBC 布局（8 字节标准帧，逐信号连续排布故不重叠；量化按「不改变 demo 判定」选）：
#   0x100 WHEEL_SPEED_1  wheelSpeed_FL/FR   16bit × 0.01 km/h
#   0x101 WHEEL_SPEED_2  wheelSpeed_RL/RR   16bit × 0.01 km/h
#   0x102 VEH_DYN_1      speed_vbox 0.01 km/h、distance_vbox 0.05 m、Ax 0.01 m/s²(有符号)
#   0x103 PEDAL_STATUS_1 BrakePedalPos/ThrottlePedalPos 8bit × 0.5 %，ABS/TCS 各 1bit
#   0x104 VEH_DYN_2      yaw_rate 16bit 有符号 × 0.01 deg/s（单独一帧，便于造「缺通道」）
#
# 接入真实数据时：把真实 DBC 追加为另一个 alias，并在对应信号的 candidates 前面
# 插入 [真实alias, "0x123", 真实信号名]；扩展帧 id 写作 "0x123x"。
dbc_files:
  BRAKE:
    path: configs/dbc/brake_demo.dbc
    channel: 0

signal_maps:
  speed_vbox:
    description: vbox 实际车速
    unit: km/h
    candidates:
      - [BRAKE, "0x102", speed_vbox]
  distance_vbox:
    description: vbox 距离
    unit: m
    candidates:
      - [BRAKE, "0x102", distance_vbox]
  wheelSpeed_FL:
    description: 左前轮速
    unit: km/h
    candidates:
      - [BRAKE, "0x100", wheelSpeed_FL]
  wheelSpeed_FR:
    description: 右前轮速
    unit: km/h
    candidates:
      - [BRAKE, "0x100", wheelSpeed_FR]
  wheelSpeed_RL:
    description: 左后轮速
    unit: km/h
    candidates:
      - [BRAKE, "0x101", wheelSpeed_RL]
  wheelSpeed_RR:
    description: 右后轮速
    unit: km/h
    candidates:
      - [BRAKE, "0x101", wheelSpeed_RR]
  yaw_rate:
    description: 横摆角速度
    unit: deg/s
    candidates:
      - [BRAKE, "0x104", yaw_rate]
  Ax:
    description: 纵向加速度
    unit: m/s2
    candidates:
      - [BRAKE, "0x102", Ax]
  ABS_Active:
    description: ABS 激活
    unit: ""
    candidates:
      - [BRAKE, "0x103", ABS_Active]
  TCS_Active:
    description: TCS 激活
    unit: ""
    candidates:
      - [BRAKE, "0x103", TCS_Active]
  BrakePedalPos:
    description: 制动踏板深度
    unit: "%"
    candidates:
      - [BRAKE, "0x103", BrakePedalPos]
  ThrottlePedalPos:
    description: 油门踏板深度
    unit: "%"
    candidates:
      - [BRAKE, "0x103", ThrottlePedalPos]
