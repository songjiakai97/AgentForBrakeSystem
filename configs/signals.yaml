# 逻辑信号登记表 + 图表分组（design.md §9.6）
#
# 本文件是「格式无关」的那一层：逻辑信号名、单位、描述、图表分行只在这里定义一次，
# MF4 / BLF 各自的 signals_*.yaml 只回答「这个逻辑信号在该格式里叫什么」。
#
# 为什么不让两份映射各自带 unit/描述：同一个物理量在两侧写两遍必然漂移，
# 而且「MF4 叫 speed_vbox、BLF 叫 vbox_speed」这类改名编译器查不出来 ——
# 逻辑名只有一个出处，才谈得上「相同的信号，逻辑名必须一致」。
#
# 覆盖度约定（§9.6）：
#   - 参与计算的信号（metrics.yaml 的 inputs + 分段器消费的通道）两侧都必须有，
#     由 load_blf_config 的 required_signals 参数把关。
#   - 纯观测量允许只出现在一种格式里：MF4 常带额外测量通道，BLF 只有 CAN 上
#     发布的信号。不再要求两侧逻辑信号集完全相同。
logical_signals:
  speed_vbox:      {description: vbox 实际车速, unit: km/h}
  distance_vbox:   {description: vbox 距离,     unit: m}
  wheelSpeed_FL:   {description: 左前轮速,      unit: km/h}
  wheelSpeed_FR:   {description: 右前轮速,      unit: km/h}
  wheelSpeed_RL:   {description: 左后轮速,      unit: km/h}
  wheelSpeed_RR:   {description: 右后轮速,      unit: km/h}
  yaw_rate:        {description: 横摆角速度,    unit: deg/s}
  Ax:              {description: 纵向加速度,    unit: m/s2}
  ABS_Active:      {description: ABS 激活,      unit: ""}
  TCS_Active:      {description: TCS 激活,      unit: ""}
  BrakePedalPos:   {description: 制动踏板深度,  unit: "%"}
  ThrottlePedalPos: {description: 油门踏板深度, unit: "%"}

# 图表布局约束：多行一列共享 x 轴（design.md §6.6）
# 每个 group = 一行子图，组内信号共用一个 y 轴（同单位才有意义）
# 分组按逻辑信号名写，所以它天然属于本文件：同一份图不该因数据格式而异。
chart_layout:
  - label: 车速 / 轮速
    unit: km/h
    signals: [speed_vbox, wheelSpeed_FL, wheelSpeed_FR, wheelSpeed_RL, wheelSpeed_RR]
  - label: 纵向加速度
    unit: m/s2
    signals: [Ax]
  - label: 横摆角速度
    unit: deg/s
    signals: [yaw_rate]
  - label: 踏板开度
    unit: "%"
    signals: [BrakePedalPos, ThrottlePedalPos]
  - label: 激活标志
    unit: ""
    signals: [ABS_Active, TCS_Active]
