# 逻辑信号登记表 + 图表分组（design.md §9.6）
#
# 本文件是「格式无关」的那一层：逻辑信号名、单位、描述、图表分行只在这里定义一次，
# MF4 / BLF 各自的 signals_*.yaml 只回答「这个逻辑信号在该格式里叫什么」。
#
# 为什么不让两份映射各自带 unit/描述：同一个物理量在两侧写两遍必然漂移，
# 而且「MF4 叫 speed_vbox、BLF 叫 vbox_speed」这类改名编译器查不出来 ——
# 逻辑名只有一个出处，才谈得上「相同的信号，逻辑名必须一致」。
#
# 覆盖度约定（§9.6）：
#   - 参与计算的信号（metrics.yaml 的 inputs + 分段器消费的通道）两侧都必须有，
#     由 load_blf_config 的 required_signals 参数把关。
#   - 纯观测量允许只出现在一种格式里：MF4 常带额外测量通道，BLF 只有 CAN 上
#     发布的信号。不再要求两侧逻辑信号集完全相同。
logical_signals:
  speed_vbox:      {description: vbox 实际车速, unit: km/h}
  distance_vbox:   {description: vbox 距离,     unit: m}
  wheelSpeed_FL:   {description: 左前轮速,      unit: km/h}
  wheelSpeed_FR:   {description: 右前轮速,      unit: km/h}
  wheelSpeed_RL:   {description: 左后轮速,      unit: km/h}
  wheelSpeed_RR:   {description: 右后轮速,      unit: km/h}
  yaw_rate:        {description: 横摆角速度,    unit: deg/s}
  Ax:              {description: 纵向加速度,    unit: m/s2}
  ABS_Active:      {description: ABS 激活,      unit: ""}
  TCS_Active:      {description: TCS 激活,      unit: ""}
  BrakePedalPos:   {description: 制动踏板深度,  unit: "%"}
  ThrottlePedalPos: {description: 油门踏板深度, unit: "%"}
  # 驱动形式与轴扭矩：底盘网信号，只在 TCS/DTCS 场景按驱动形式动态出图，
  # 不写进 chart_layout（否则 ABS 也会多出一排空子图）。
  VehDriveType:     {description: 驱动类型,       unit: ""}
  MMotTarFastFA:    {description: 前轴快速降扭请求, unit: N.m}
  MMotTarFastRA:    {description: 后轴快速降扭请求, unit: N.m}
  DMCTarTorqueFA:   {description: DMC 前轴目标扭矩, unit: N.m}
  DMCTarTorqueRA:   {description: DMC 后轴目标扭矩, unit: N.m}
  FrontMotorTorque: {description: 前轴实际扭矩,   unit: N.m}
  RearMotorTorque:  {description: 后轴实际扭矩,   unit: N.m}

# 驱动形式（design.md §9.5）：底盘网的 VehDriveType 决定「看哪根轴」，
# 有 DMC 目标扭矩即 DTCS，否则 TCS。显式选择的档位优先于这里的识别结果。
drive:
  function: tcs              # 只有 TCS 功能需要按驱动形式选轴
  signal: VehDriveType
  types:
    0x0: {name: 系统故障,               layout: other}
    0x1: {name: 纯电动四驱,             layout: awd}
    0x2: {name: HEV三动力四驱,          layout: awd}
    0x3: {name: HEV四驱(后电机+发动机), layout: awd}
    0x4: {name: HEV两驱(前电机+发动机), layout: front}
    0x5: {name: 纯燃油,                 layout: other}
    0x6: {name: 纯电动前驱,             layout: front}
    0x7: {name: 纯电动后驱,             layout: rear}
    0x8: {name: 动力系统未启用,         layout: other}
    0x9: {name: 保留,                   layout: other}
    0xA: {name: 保留,                   layout: other}
    0xB: {name: 保留,                   layout: other}
    0xC: {name: 保留,                   layout: other}
    0xD: {name: 保留,                   layout: other}
    0xE: {name: 保留,                   layout: other}
    0xF: {name: 保留,                   layout: other}
  # 驱动形式 → 档位维度取值；other 不产生档位识别
  layouts: {awd: 4WD, front: 2WD, rear: 2WD}
  # 有 DMC 目标扭矩 → DTCS，否则 TCS
  assist: {dtcs: DTCS, tcs: TCS}
  torque:
    actual: {front: FrontMotorTorque, rear: RearMotorTorque}
    tcs:    {front: MMotTarFastFA,    rear: MMotTarFastRA}
    dtcs:   {front: DMCTarTorqueFA,   rear: DMCTarTorqueRA}

# 图表布局约束：多行一列共享 x 轴（design.md §6.6）
# 每个 group = 一行子图，组内信号共用一个 y 轴（同单位才有意义）
# 分组按逻辑信号名写，所以它天然属于本文件：同一份图不该因数据格式而异。
chart_layout:
  - label: 车速 / 轮速
    unit: km/h
    signals: [speed_vbox, wheelSpeed_FL, wheelSpeed_FR, wheelSpeed_RL, wheelSpeed_RR]
  # 距离是 vbox 的另一个观测量（制动距离的输入），单位 m，不能并进车速那一轴
  - label: 行驶距离
    unit: m
    signals: [distance_vbox]
  - label: 纵向加速度
    unit: m/s2
    signals: [Ax]
  - label: 横摆角速度
    unit: deg/s
    signals: [yaw_rate]
  - label: 踏板开度
    unit: "%"
    signals: [BrakePedalPos, ThrottlePedalPos]
  # 激活标志各占一行：不同功能的状态量叠在同一 y 轴上会互相压住，
  # 而且「一个功能只关心自己那个激活信号」，分开后 only 过滤直接整行消失。
  - label: ABS 激活
    unit: ""
    signals: [ABS_Active]
  - label: TCS 激活
    unit: ""
    signals: [TCS_Active]
